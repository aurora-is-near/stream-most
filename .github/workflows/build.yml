name: Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name || '' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: streamcopier
            app: streamcopier
          - image: multi-stream-bridge
            app: multistreambridge
          - image: stream-validator
            app: streamvalidator

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if VERSION follows the x.x.x format
        run: |
          if [[ "${{ env.VERSION }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "LATEST_TAG_ENABLED=true" >> $GITHUB_ENV
          else
            echo "LATEST_TAG_ENABLED=false" >> $GITHUB_ENV
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/aurora-is-near/${{ matrix.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.LATEST_TAG_ENABLED == 'true' }}
            type=raw,value=testnet
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: template.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP=${{ matrix.app }}
